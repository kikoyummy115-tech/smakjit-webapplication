<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% block title %}
    <title>Verify Otp</title>
    {% endblock %}
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="col-span-1">
      {% with messages = get_flashed_messages(with_categories=true) %}
      <div id="toast-container">
        {% for category, message in messages %}
        <div class="fixed toast-card alert alert-{{ category }}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endwith %} {% block content %} {% endblock %}
    </div>
    <div class="flex h-screen items-center justify-center">
      <form
        action="{{ url_for('auth.verify_reset_otp')}}"
        method="POST"
        class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
      >
        <h1 class="font-semibold text-lg">Enter reset verification code</h1>
        <label class="otp">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <input
            type="text"
            autocomplete="one-time-code"
            inputmode="numeric"
            maxlength="6"
            minlength="6"
            pattern="\d{6}"
            required
            id="otp"
            name="otp"
          />
        </label>
        <button type="submit" class="btn btn-success mt-4">Verify</button>
      </form>
    </div>
  </body>
  <script src="{{ url_for('static', filename='js/toastMessage.js') }}"></script>
</html>
