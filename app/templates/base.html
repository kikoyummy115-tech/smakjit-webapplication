<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    {% block title %}
    <title>Attendance</title>
    {% endblock %}

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="drawer lg:drawer-open">
      <input id="my-drawer-3" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content">
        <!-- Page content here -->

        <div class="col-span-1">
          {% with messages = get_flashed_messages(with_categories=true) %}
          <div id="toast-container">
            {% for category, message in messages %}
            <div class="fixed toast-card alert alert-{{ category }}">
              {{ message }}
            </div>
            {% endfor %}
          </div>
          {% endwith %} {% block content %} {% endblock %}
        </div>

        <label
          for="my-drawer-3"
          class="btn drawer-button lg:hidden fixed top-0"
        >
          <span class="material-symbols-outlined"> menu </span>
        </label>
      </div>
      <div class="drawer-side">
        <label
          for="my-drawer-3"
          aria-label="close sidebar"
          class="drawer-overlay"
        ></label>

        {% include 'views/sidebar.html' %}
      </div>
    </div>
  </body>
  <script src="{{ url_for('static', filename='js/toastMessage.js') }}"></script>
</html>
