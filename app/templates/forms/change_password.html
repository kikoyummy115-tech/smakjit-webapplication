{% extends 'base.html' %} {% block title %}<title>Change Password</title>{%
endblock %} {% block content %}
<div class="flex h-screen items-center justify-center bg-gray-200">
  <form
    action="{{ url_for('main.change_password') }}"
    method="POST"
    class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
  >
    <h1 class="text-lg font-semibold">Change password</h1>

    <label class="label">Password</label>
    <input
      type="password"
      class="input"
      placeholder="Password"
      name="old_password"
    />
    <label class="label">New password</label>
    <input
      type="password"
      class="input"
      placeholder="Password"
      name="new_password"
    />
    <button class="btn btn-outline mt-4" type="submit">Confirm</button>

    <a
      class="flex justify-center items-center gap-1 font-semibold text-slate-600 mt-2"
      href="{{ url_for('main.profile') }}"
    >
      <span class="material-symbols-outlined text-sm">arrow_back_2</span>Back
    </a>
  </form>
</div>
{% endblock %}
